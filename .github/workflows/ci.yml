name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres_ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://nvs:nvs_ci@localhost:5432/nvs_test
      TEST_DATABASE_URL: postgres://nvs:nvs_ci@localhost:5432/nvs_test
      JWT_SECRET: ci-only-secret-0123456789-0123456789-0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # o usuário criado pela imagem é superusuário e ignora o RLS (até com FORCE), o que mistura os dados
      # das empresas nos testes; a API e as migrations rodam com um papel comum, como no ambiente local
      - name: Cria papel da aplicação sem superusuário
        env: { PGPASSWORD: postgres_ci }
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE nvs LOGIN PASSWORD 'nvs_ci'" \
            -c "CREATE DATABASE nvs_test OWNER nvs"
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
