<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar ADS — protótipo</title>
<link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.0.1/index.min.css" rel="stylesheet">
<style>
  :root {
    --navy: #0b1c4d; --blue: #1f5fff; --blue-deep: #1448d6; --blue-soft: #eaf0ff;
    --yellow: #f5b800; --yellow-soft: #fff4d1;
    --gray-50: #f7f8fb; --gray-100: #eef0f5; --gray-300: #cfd4e0; --gray-500: #6a7285;
    --ink: #0d1424; --danger: #d6293e; --ok: #0e8a5f; --surface: #fff;
    --ok-soft: #e3f6ef; --danger-soft: #fde4e7; --purple-soft: #f3eefc;
    --ok-ink: #0b6a49; --danger-ink: #a3182b; --warn-ink: #7a5600;
    --font: 'Geist Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--gray-50); color: var(--ink); font-family: var(--font); overflow: hidden; }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; gap: 14px; padding: 14px; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: var(--surface); border-radius: 28px; box-shadow: 0 0 0 1px var(--gray-100), 0 18px 40px -32px rgba(11,28,77,.45); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-ico { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--blue-deep), var(--blue) 60%, #4a82ff); color: #fff; font-size: 19px; box-shadow: 0 10px 20px -10px rgba(31,95,255,.8); position: relative; }
  .brand-ico::after { content: ''; position: absolute; inset: -4px; border-radius: 18px; border: 2px solid rgba(31,95,255,.3); animation: ring 2.6s infinite; }
  @keyframes ring { 0% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
  .brand b { display: block; font-size: 1.1rem; font-weight: 650; letter-spacing: -.02em; color: var(--navy); }
  .brand small { color: var(--gray-500); font-size: .78rem; }
  .kpis { display: flex; gap: 8px; margin-left: 10px; flex-wrap: wrap; }
  .kpi { border: 0; text-align: left; font: inherit; cursor: pointer; padding: 7px 14px; border-radius: 18px; background: var(--gray-50); font-size: .72rem; color: var(--gray-500); font-weight: 500; transition: transform .2s, box-shadow .2s; }
  .kpi:hover { transform: translateY(-2px); box-shadow: 0 0 0 2px rgba(31,95,255,.25); }
  .kpi b { display: block; font-size: 1rem; color: var(--navy); font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi.bad { background: var(--danger-soft); color: var(--danger-ink); } .kpi.bad b { color: var(--danger); }
  .kpi.ok { background: var(--ok-soft); color: var(--ok-ink); } .kpi.ok b { color: var(--ok); }
  .spacer { flex: 1; }
  .btn { height: 40px; padding: 0 16px; border: 0; border-radius: 999px; cursor: pointer; font: inherit; font-size: .86rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; background: var(--gray-100); color: var(--navy); white-space: nowrap; transition: transform .2s cubic-bezier(.2,.7,.2,1), box-shadow .25s, background .2s; }
  .btn:hover { background: var(--blue-soft); transform: translateY(-1px); }
  .btn.primary { color: #fff; background: linear-gradient(115deg, var(--blue-deep), var(--blue) 55%, #4a82ff); box-shadow: 0 14px 28px -12px rgba(31,95,255,.7); }
  .btn.primary:hover { transform: translateY(-2px); }
  .btn kbd { font: 600 .66rem var(--font); color: var(--gray-500); background: var(--surface); padding: 1px 6px; border-radius: 6px; box-shadow: 0 0 0 1px var(--gray-300); }

  main { position: relative; overflow: hidden; cursor: grab; background: var(--surface); border-radius: 28px; box-shadow: 0 0 0 1px var(--gray-100), 0 22px 44px -36px rgba(11,28,77,.45); }
  main.panning { cursor: grabbing; }
  #grid { position: absolute; inset: 0; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: opacity .25s; }
  #world.swap { opacity: 0; }
  svg#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .wire { fill: none; stroke: var(--gray-300); stroke-width: 2.5; }
  .wire.flow { stroke: var(--blue); stroke-dasharray: 6 12; stroke-linecap: round; animation: flow 1.1s linear infinite; }
  .wire.hot { stroke: #f6b8c1; }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  .wire-label { font: 600 11px var(--font); }

  .node { position: absolute; width: 240px; background: var(--surface); border-radius: 22px; padding: 14px 16px; cursor: pointer; user-select: none; box-shadow: 0 0 0 1px var(--gray-100), 0 14px 30px -20px rgba(11,28,77,.35); transition: box-shadow .25s, transform .2s cubic-bezier(.2,.7,.2,1); }
  .node:hover { transform: translateY(-3px); box-shadow: 0 0 0 2px rgba(31,95,255,.35), 0 22px 40px -22px rgba(31,95,255,.55); }
  .node.dragging { transform: scale(1.03) rotate(-.6deg); box-shadow: 0 0 0 2px var(--blue), 0 30px 50px -24px rgba(31,95,255,.6); }
  .node.wide { width: 270px; }
  .node .kind { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gray-500); font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .node .kind i { width: 26px; height: 26px; border-radius: 10px; display: inline-grid; place-items: center; font-style: normal; font-size: 13px; }
  .node .title { margin-top: 8px; font-size: .95rem; font-weight: 650; letter-spacing: -.01em; color: var(--navy); }
  .node .big { font-size: 1.6rem; font-weight: 650; letter-spacing: -.03em; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .node .sub { margin-top: 3px; font-size: .78rem; color: var(--gray-500); }
  .node .open { margin-top: 10px; font-size: .74rem; font-weight: 650; color: var(--blue-deep); }
  .chip { display: inline-block; margin: 8px 4px 0 0; padding: 3px 10px; border-radius: 99px; font-size: .72rem; font-weight: 650; background: var(--gray-100); color: var(--navy); font-variant-numeric: tabular-nums; }
  .chip.red { background: var(--danger-soft); color: var(--danger-ink); }
  .chip.green { background: var(--ok-soft); color: var(--ok-ink); }
  .chip.yellow { background: var(--yellow-soft); color: var(--warn-ink); }
  .port { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--blue); top: 50%; margin-top: -7px; }
  .port.in { left: -7px; } .port.out { right: -7px; }
  .node.alert { box-shadow: 0 0 0 2px rgba(214,41,62,.35), 0 18px 36px -22px rgba(214,41,62,.5); }
  .node.alert::before { content: attr(data-badge); position: absolute; top: -11px; right: 16px; padding: 2px 10px; border-radius: 99px; background: var(--danger); color: #fff; font-size: .66rem; font-weight: 700; letter-spacing: .04em; animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  .stack { position: relative; }
  .stack::after, .stack::before { content: ''; position: absolute; left: 10px; right: 10px; height: 10px; border-radius: 0 0 18px 18px; background: var(--surface); box-shadow: 0 0 0 1px var(--gray-100); z-index: -1; }
  .stack::after { bottom: -6px; } .stack::before { bottom: -11px; left: 20px; right: 20px; opacity: .7; }
  .dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 10px; }
  .dots span { width: 10px; height: 10px; border-radius: 4px; }
  .toggle { position: relative; width: 40px; height: 22px; border-radius: 99px; background: var(--gray-300); cursor: pointer; flex: none; transition: background .2s; }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(11,28,77,.3); transition: left .25s cubic-bezier(.2,1.2,.4,1); }
  .toggle.on { background: var(--ok); }
  .toggle.on::after { left: 21px; }

  .crumb { position: absolute; left: 16px; top: 14px; z-index: 3; display: flex; gap: 8px; align-items: center; }
  .crumb .btn { height: 34px; padding: 0 14px; font-size: .8rem; background: var(--surface); box-shadow: 0 0 0 1px var(--gray-100); }
  .crumb span { font-size: .85rem; font-weight: 650; color: var(--navy); background: rgba(255,255,255,.92); padding: 6px 12px; border-radius: 99px; box-shadow: 0 0 0 1px var(--gray-100); }
  .hint { position: absolute; left: 16px; bottom: 14px; font-size: .76rem; color: var(--gray-500); z-index: 3; background: rgba(255,255,255,.9); padding: 6px 12px; border-radius: 99px; }
  @media (max-width: 1100px) { .hint { display: none; } }
  .zoom { position: absolute; right: 16px; bottom: 14px; display: flex; gap: 6px; z-index: 3; }
  .zoom .btn { height: 36px; padding: 0 14px; background: var(--surface); box-shadow: 0 0 0 1px var(--gray-100); }

  .drawer { position: absolute; left: 14px; top: 14px; bottom: 14px; width: 320px; z-index: 15; background: rgba(255,255,255,.97); border-radius: 28px; padding: 18px 16px; display: flex; flex-direction: column; box-shadow: 0 0 0 1px var(--gray-100), 0 30px 60px -30px rgba(11,28,77,.5); transform: translateX(calc(-100% - 30px)); transition: transform .4s cubic-bezier(.2,1.1,.3,1); cursor: default; }
  .drawer.open { transform: none; }
  .drawer h3 { margin: 0 0 10px; font-size: 1.15rem; font-weight: 650; color: var(--navy); letter-spacing: -.02em; }
  .search { position: relative; margin-bottom: 10px; display: block; }
  .search input { width: 100%; height: 42px; border: 0; border-radius: 999px; padding: 0 16px 0 40px; background: var(--gray-50); font: inherit; font-size: .88rem; color: var(--navy); outline: none; box-shadow: 0 0 0 1px var(--gray-100); transition: box-shadow .2s, background .2s; }
  .search input:focus { background: var(--surface); box-shadow: 0 0 0 2px rgba(31,95,255,.4); }
  .search::before { content: '⌕'; position: absolute; left: 15px; top: 9px; font-size: 17px; color: var(--gray-500); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .f { border: 0; cursor: pointer; font: 600 .74rem var(--font); padding: 5px 10px; border-radius: 99px; background: var(--gray-100); color: var(--gray-500); transition: .2s; }
  .f.on { background: var(--navy); color: #fff; }
  .f b { font-weight: 700; margin-left: 3px; }
  .sort { display: flex; justify-content: space-between; align-items: center; margin: 12px 6px 6px; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gray-500); font-weight: 700; }
  .sort select { border: 0; background: none; font: 600 .74rem var(--font); color: var(--blue-deep); cursor: pointer; }
  #camps { overflow: auto; flex: 1; margin: 0 -6px; padding: 0 6px; }
  .camp { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 18px; cursor: pointer; transition: background .2s, transform .2s; }
  .camp:hover { background: var(--gray-50); transform: translateX(2px); }
  .camp.active { background: var(--blue-soft); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .camp .name { font-size: .88rem; flex: 1; color: var(--navy); }
  .camp .rules { font-size: .7rem; color: var(--gray-500); display: block; }
  .camp .val { font-size: .8rem; font-weight: 650; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 99px; }
  .spark { width: 46px; height: 18px; flex: none; }
  .empty { padding: 20px 10px; text-align: center; color: var(--gray-500); font-size: .85rem; }

  .modal-wrap { position: absolute; inset: 0; display: none; place-items: center; background: rgba(11,28,77,.24); backdrop-filter: blur(6px); z-index: 20; cursor: default; padding: 20px; }
  .modal-wrap.open { display: grid; }
  .modal { position: relative; width: min(500px, 100%); max-height: 100%; overflow: auto; background: var(--surface); padding: 30px 32px 26px; border-radius: 36px 36px 36px 90px / 36px 36px 36px 80px; box-shadow: 0 0 0 1px rgba(207,212,224,.6), 0 40px 80px -30px rgba(20,72,214,.4); animation: pop .35s cubic-bezier(.2,1.2,.4,1); }
  .modal.wide { width: min(900px, 100%); border-radius: 36px; }
  @keyframes pop { from { transform: translateY(16px) scale(.97); opacity: 0; } }
  .modal h3 { margin: 0 0 4px; font-weight: 650; font-size: 1.4rem; letter-spacing: -.025em; color: var(--navy); }
  .modal p { margin: 0 0 18px; color: var(--gray-500); font-size: .88rem; }
  .x { position: absolute; right: 18px; top: 18px; width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; background: var(--gray-100); color: var(--navy); font-size: 16px; transition: background .2s, transform .2s; z-index: 2; }
  .x:hover { background: var(--blue-soft); transform: rotate(90deg); }
  .sentence { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 1rem; line-height: 2.1; color: var(--navy); }
  .pill { padding: 4px 14px; border-radius: 99px; background: var(--blue-soft); color: var(--blue-deep); cursor: pointer; font-weight: 650; font-size: .92rem; transition: background .2s, transform .15s; }
  .pill:hover { background: #d9e4ff; transform: translateY(-1px); }
  .pill.add { background: var(--gray-100); color: var(--gray-500); }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 12px 16px; border-radius: 18px; background: var(--gray-50); font-size: .88rem; color: var(--navy); }
  .row .grow { flex: 1; }
  .row.click { cursor: pointer; transition: background .2s, transform .2s; } .row.click:hover { background: var(--blue-soft); transform: translateX(3px); }
  .preview { margin-top: 16px; padding: 12px 16px; border-radius: 22px 22px 22px 6px; background: var(--yellow-soft); color: var(--warn-ink); font-size: .85rem; line-height: 1.45; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .menu { position: absolute; z-index: 30; background: var(--surface); border-radius: 18px; padding: 6px; min-width: 170px; display: none; box-shadow: 0 0 0 1px var(--gray-100), 0 20px 40px -18px rgba(11,28,77,.4); animation: pop .25s cubic-bezier(.2,1.2,.4,1); }
  .menu div { padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: .88rem; color: var(--navy); }
  .menu div:hover { background: var(--blue-soft); color: var(--blue-deep); }

  .goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .goal { padding: 16px 18px; border-radius: 24px; background: var(--gray-50); }
  .goal .g-top { display: flex; justify-content: space-between; gap: 8px; font-size: .74rem; color: var(--gray-500); font-weight: 600; }
  .goal .g-val { font-size: 1.3rem; font-weight: 650; color: var(--navy); margin-top: 4px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .goal .g-val small { font-size: .8rem; color: var(--gray-500); font-weight: 500; }
  .track { position: relative; height: 10px; border-radius: 99px; background: var(--gray-100); margin: 12px 0 8px; box-shadow: inset 0 0 0 1px rgba(207,212,224,.5); }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--blue-deep), var(--blue)); }
  .track .proj { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: repeating-linear-gradient(45deg, rgba(31,95,255,.25) 0 4px, transparent 4px 8px); }
  .track .today { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--navy); border-radius: 2px; }
  .goal .g-foot { font-size: .76rem; color: var(--gray-500); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 99px; font-weight: 650; font-size: .72rem; white-space: nowrap; }
  .feed { display: grid; gap: 8px; }
  .ev { padding: 12px 14px; border-radius: 22px 22px 22px 6px; font-size: .84rem; cursor: pointer; transition: transform .2s; }
  .ev:hover { transform: translateX(3px); }
  .ev small { display: block; margin-bottom: 3px; font-size: .7rem; opacity: .8; }
  .ev.bad { background: var(--danger-soft); color: var(--danger-ink); }
  .ev.warn { background: var(--yellow-soft); color: var(--warn-ink); }
  .ev.bot { background: var(--purple-soft); color: #4b2fc9; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); grid-auto-flow: dense; gap: 10px; }
  .tile { position: relative; padding: 12px 14px; border-radius: 20px; background: var(--gray-50); cursor: pointer; transition: transform .2s cubic-bezier(.2,.7,.2,1), box-shadow .25s; }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 0 0 2px rgba(31,95,255,.35); }
  .tile.big { grid-column: span 2; }
  .tile .t-name { font-weight: 650; font-size: .85rem; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 14px; }
  .tile .t-val { font-size: 1.35rem; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .t-meta { font-size: .72rem; color: var(--gray-500); }
  .tile .bar { height: 6px; border-radius: 99px; background: var(--gray-100); margin-top: 8px; position: relative; box-shadow: inset 0 0 0 1px rgba(207,212,224,.5); }
  .tile .bar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
  .tile .bar i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--navy); border-radius: 2px; }
  .tile svg { position: absolute; right: 12px; top: 36px; width: 60px; height: 24px; }
  .tile.bad::after { content: ''; position: absolute; top: 14px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: blink 1.4s infinite; }
  @keyframes blink { 50% { box-shadow: 0 0 0 6px rgba(214,41,62,.15); } }
  .sec { margin: 22px 0 10px; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gray-500); font-weight: 700; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="brand-ico">◎</span><div><b>Radar ADS</b><small id="hsub">Conta Novaes</small></div></div>
    <div class="kpis">
      <button class="kpi" data-open="goals">Meta de outubro<b>R$ 23.480 / 32.000</b></button>
      <button class="kpi bad" data-open="goals">TACOS da conta<b>4,6%</b></button>
      <button class="kpi ok" data-open="overview">ROAS<b>9,8x</b></button>
      <button class="kpi bad" data-open="feed">Alertas hoje<b>3</b></button>
    </div>
    <div class="spacer"></div>
    <button class="btn" data-open="drawer">Campanhas <kbd>⌘K</kbd></button>
    <button class="btn" data-open="overview">Visão geral</button>
    <button class="btn" id="btn-sim">Simular</button>
    <button class="btn primary" id="btn-add">+ Bloco</button>
  </header>

  <main id="stage">
    <canvas id="grid"></canvas>
    <div id="world"><svg id="wires"></svg></div>
    <div class="crumb" id="crumb"></div>
    <div class="hint">Arraste o fundo · roda do mouse dá zoom · clique em qualquer bloco</div>
    <div class="zoom"><button class="btn" id="zout">−</button><button class="btn" id="zfit">Centralizar</button><button class="btn" id="zin">+</button></div>

    <aside class="drawer" id="drawer">
      <button class="x" data-close-drawer aria-label="Fechar">✕</button>
      <h3>Campanhas</h3>
      <label class="search"><input id="q" placeholder="Buscar campanha" autocomplete="off"></label>
      <div class="filters" id="filters"></div>
      <div class="sort">Ordem <select id="order"><option value="risk">Mais arriscadas</option><option value="spend">Maior investimento</option><option value="name">Nome</option></select></div>
      <div id="camps"></div>
    </aside>

    <div class="modal-wrap" id="modal"><div class="modal" id="modal-body"></div></div>
    <div class="menu" id="menu"></div>
  </main>
</div>

<script>
const NAMES = ['Linha Cozinha', 'Organizadores', 'Kit Banheiro', 'Lançamentos', 'Curva A', 'Potes Herméticos', 'Cabides Veludo', 'Porta-temperos', 'Lixeiras Inox', 'Escorredores', 'Kit Churrasco', 'Tábuas de Corte', 'Garrafas Térmicas', 'Marmitas', 'Utilidades Black', 'Toalhas', 'Varal Retrátil', 'Caixas Organizadoras', 'Sapateiras', 'Cozinha Premium', 'Liquidação', 'Catálogo Geral', 'Kits Presente', 'Novos SKUs'];
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const campaigns = NAMES.map((name, i) => {
  const tacos = +(1.4 + rnd() * 3.9).toFixed(1), spend = Math.round(150 + rnd() * rnd() * 3200);
  const trend = Array.from({ length: 7 }, () => +(tacos + (rnd() - 0.5) * 1.6).toFixed(2)); trend[6] = tacos;
  return { id: i, name, tacos, spend, trend, rules: 1 + Math.floor(rnd() * 3), limit: 4, robot: rnd() > 0.75 };
});
Object.assign(campaigns[0], { tacos: 5.2, spend: 2140 });
const status = (c) => c.tacos > c.limit ? 'bad' : c.tacos > c.limit * 0.85 ? 'warn' : 'ok';
const TONE = { bad: ['#d6293e', '#fde4e7', '#a3182b'], warn: ['#f5b800', '#fff4d1', '#7a5600'], ok: ['#0e8a5f', '#e3f6ef', '#0b6a49'] };
const LABEL = { all: 'Todas', bad: 'Estouradas', warn: 'Atenção', ok: 'Ok' };
const fmt = (n) => n.toFixed(1).replace('.', ',');
const brl = (n) => 'R$ ' + n.toLocaleString('pt-BR');
const byStatus = (s) => campaigns.filter((c) => status(c) === s);
const spark = (c, w, h, color) => {
  const max = Math.max(...c.trend), min = Math.min(...c.trend);
  const pts = c.trend.map((v, j) => `${(j * w / 6).toFixed(1)},${(h - 2 - ((v - min) / (max - min || 1)) * (h - 4)).toFixed(1)}`).join(' ');
  return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
};

function renderAll() {

function port(n, side) { const el = document.getElementById('n-' + n.id); return { x: n.x + (side === 'out' ? el.offsetWidth : 0), y: n.y + el.offsetHeight / 2 }; }
function renderWires() {
  wires.innerHTML = edges.map(([a, b, label]) => {
    const A = port(nodes.find((n) => n.id === a), 'out'), B = port(nodes.find((n) => n.id === b), 'in');
    const dx = Math.max(60, (B.x - A.x) / 2);
    const d = `M${A.x},${A.y} C${A.x + dx},${A.y} ${B.x - dx},${B.y} ${B.x},${B.y}`;
    const hot = label === 'sim', w = label ? label.length * 7 + 18 : 0;
    const txt = label ? `<g transform="translate(${(A.x + B.x) / 2},${(A.y + B.y) / 2})"><rect x="${-w / 2}" y="-11" width="${w}" height="22" rx="11" fill="${hot ? '#fde4e7' : '#eef0f5'}"/>
      <text class="wire-label" text-anchor="middle" y="4" fill="${hot ? '#a3182b' : '#6a7285'}">${label}</text></g>` : '';
    return `<path class="wire ${hot ? 'hot' : ''}" d="${d}"/><path class="wire flow" d="${d}" style="${hot ? 'stroke:#d6293e' : ''}"/>${txt}`;
  }).join('');

let view = { x: 40, y: 40, k: 1 };
const applyView = () => { world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; };
function fit() {
  const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
  const w = Math.max(...xs) + 290 - Math.min(...xs), h = Math.max(...ys) + 200 - Math.min(...ys);
  const k = Math.min(1, (stage.clientWidth - 80) / w, (stage.clientHeight - 110) / h);
  view = { k, x: (stage.clientWidth - w * k) / 2 - Math.min(...xs) * k, y: (stage.clientHeight - h * k) / 2 - Math.min(...ys) * k + 10 };
  applyView();
}

function bindNode(el) {
  let start = null, moved = false;
  el.addEventListener('pointerdown', (e) => {
    if (e.target.hasAttribute('data-toggle')) return;
    const n = el._node; e.stopPropagation(); start = { x: e.clientX, y: e.clientY, nx: n.x, ny: n.y }; moved = false;
    el.setPointerCapture(e.pointerId); el.classList.add('dragging');
  });
  el.addEventListener('pointermove', (e) => {
    if (!start) return; const n = el._node;
    const dx = (e.clientX - start.x) / view.k, dy = (e.clientY - start.y) / view.k;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    n.x = start.nx + dx; n.y = start.ny + dy; el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; renderWires();
  });
  const end = () => { el.classList.remove('dragging'); start = null; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('click', (e) => {
    if (e.target.hasAttribute('data-toggle')) { robot = !robot; renderAll(); return; }
    if (!moved) nodeClick(el._node);
  });
}

addEventListener('resize', () => { resize(); fit(); }); resize();
function drawGrid(now) {
  const w = stage.clientWidth, h = stage.clientHeight, gap = 26 * view.k, t = (now - t0) / 1000;
  glow.x += (mouse.x - glow.x) * 0.12; glow.y += (mouse.y - glow.y) * 0.12;
  ctx.clearRect(0, 0, w, h);
  const ox = ((view.x % gap) + gap) % gap, oy = ((view.y % gap) + gap) % gap;
  for (let x = ox; x < w; x += gap) for (let y = oy; y < h; y += gap) {
    const dx = x - glow.x, dy = y - glow.y, d = Math.sqrt(dx * dx + dy * dy), f = Math.max(0, 1 - d / 150);
    const push = f * f * 4, nx = d ? dx / d : 0, ny = d ? dy / d : 0;
    const wave = Math.sin(t * 0.9 + (x + y) * 0.012) * 0.5 + 0.5;
    ctx.fillStyle = f > 0.02 ? `rgba(31,95,255,${0.14 + f * 0.3})` : `rgba(106,114,133,${0.13 + wave * 0.05})`;
    ctx.beginPath(); ctx.arc(x + nx * push, y + ny * push, 1 + f * 0.8, 0, 6.283); ctx.fill();
  }
  requestAnimationFrame(drawGrid);
}
requestAnimationFrame(drawGrid);

let pan = null;
stage.addEventListener('pointermove', (e) => { const r = stage.getBoundingClientRect(); mouse = { x: e.clientX - r.left, y: e.clientY - r.top }; if (pan) { if (e.buttons === 0) { pan = null; stage.classList.remove('panning'); return; } view.x = pan.vx + e.clientX - pan.x; view.y = pan.vy + e.clientY - pan.y; applyView(); } });
stage.addEventListener('pointerleave', () => { mouse = { x: -999, y: -999 }; });
stage.addEventListener('pointerdown', (e) => { if (e.target === cv || e.target === stage) { pan = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; stage.classList.add('panning'); drawer.classList.remove('open'); } });
['pointerup', 'pointercancel', 'mouseup'].forEach((ev) => addEventListener(ev, () => { pan = null; stage.classList.remove('panning'); }));
stage.addEventListener('wheel', (e) => {
  if (e.target.closest('.drawer, .modal-wrap')) return;
  e.preventDefault(); const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.min(1.8, Math.max(0.35, view.k * (e.deltaY < 0 ? 1.1 : 0.9)));
  view.x = mx - (mx - view.x) * (k / view.k); view.y = my - (my - view.y) * (k / view.k); view.k = k; applyView();
}, { passive: false });
const zoomBy = (f) => { view.k = Math.min(1.8, Math.max(0.35, view.k * f)); applyView(); };
document.getElementById('zin').onclick = () => zoomBy(1.15);
document.getElementById('zout').onclick = () => zoomBy(0.87);
document.getElementById('zfit').onclick = fit;

go(null);
</script>
